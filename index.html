<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AXIOM | Scholarly Archive</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: { ready: () => { MathJax.startup.defaultReady(); window.mjReady = true; } }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scholarly-bg">
        <span class="float-math">∫</span><span class="float-math">∑</span><span class="float-math">π</span>
        <span class="float-math">∂</span><span class="float-math">∮</span><span class="float-math">∞</span>
    </div>

    <div class="app-container">
        <!-- AUTH -->
        <div id="screen-login" class="screen">
            <div class="auth-container">
                <div class="academic-seal">A</div>
                <h1 class="serif-title main-logo">AXIOM</h1>
                <p class="label">Library Access Authorization</p>
                <div class="auth-card">
                    <input type="text" id="callsign-input" placeholder="Scholar Identity" autocomplete="off">
                    <button class="btn-main" onclick="submitLogin()">Access Library</button>
                </div>
            </div>
        </div>

        <!-- HOME -->
        <div id="screen-home" class="screen hidden">
            <header class="header-ui">
                <div class="meta"><span id="rank-tag" class="label">Mastery: Novice</span><h2 id="display-name" class="serif-title">Scholar</h2></div>
                <button class="quiet-btn" onclick="toggleMute()">Mute</button>
            </header>
            <div class="content-scroll">
                <div class="retention-ring">
                    <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="48"></circle><circle id="xp-ring" class="fill" cx="50" cy="50" r="48"></circle></svg>
                    <div class="ring-label"><span id="level-val">1</span><small class="label">Index</small></div>
                </div>
                <div class="stat-row">
                    <div class="stat-box"><label class="label">Best</label><span id="best-val" class="serif-title">0</span></div>
                    <div class="stat-box"><label class="label">Acc%</label><span id="accuracy-val" class="serif-title">0%</span></div>
                </div>
                <button class="btn-main" onclick="showScreen('screen-chapters')">Start Session</button>
                <button id="repair-btn" class="btn-outline" style="display:none;" onclick="startRepair()">Repair Gaps</button>
            </div>
        </div>

        <!-- ARENA -->
        <div id="screen-game" class="screen hidden">
            <div class="arena-hud">
                <div id="lives-box">❤️❤️❤️</div>
                <div class="timer-container"><div id="timer-fill"></div></div>
                <div id="streak-box" class="serif-title">0</div>
            </div>
            <div class="arena-content">
                <div class="formula-card"><div class="math-rail" id="formula-display"></div></div>
                <div id="options-stack" class="options-vertical"></div>
            </div>
        </div>

        <!-- LISTS -->
        <div id="screen-chapters" class="screen hidden">
            <header class="header-ui"><button class="btn-icon" onclick="showScreen('screen-home')">←</button><h2>Archives</h2></header>
            <div class="content-scroll" id="chapter-list">
                <button class="list-card serif-title" onclick="selectChapter('trigonometry')">Trigonometry</button>
                <button class="list-card serif-title" onclick="selectChapter('calculus')">Calculus</button>
            </div>
        </div>

        <div id="screen-difficulty" class="screen hidden">
            <header class="header-ui"><button class="btn-icon" onclick="showScreen('screen-chapters')">←</button><h2>Pace</h2></header>
            <div class="content-scroll">
                <button class="list-card" onclick="setDiff(30)">Contemplative (30s)</button>
                <button class="list-card" onclick="setDiff(15)">Focused (15s)</button>
                <button class="list-card critical" onclick="setDiff(8)">Instant (8s)</button>
            </div>
        </div>

        <div id="screen-vault" class="screen hidden"><header class="header-ui"><h2>Flashcards</h2></header><div class="content-scroll" id="vault-list"></div></div>
        <div id="screen-logs" class="screen hidden"><header class="header-ui"><h2>Gaps</h2></header><div class="content-scroll" id="logs-list"></div></div>

        <!-- BOTTOM NAV -->
        <nav class="bottom-dock hidden" id="main-dock">
            <div class="dock-item active" onclick="showScreen('screen-home')">Library</div>
            <div class="dock-item" onclick="showScreen('screen-vault')">Archive</div>
            <div class="dock-item" onclick="showScreen('screen-logs')">Gaps</div>
        </nav>
    </div>

    <!-- OVERLAYS -->
    <div id="roast-overlay" class="overlay hidden">
        <div class="recall-sheet">
            <p id="roast-msg" class="italic-text"></p>
            <div class="answer-reveal"><small class="label">Correct Identity</small><div class="math-rail" id="correct-display"></div></div>
            <button class="btn-main" onclick="closeRoast()">Resume</button>
        </div>
    </div>

    <div id="results-overlay" class="overlay hidden">
        <div class="recall-sheet">
            <h2 id="results-title" class="serif-title">Mastery</h2>
            <div class="stat-row"><div class="stat-box"><label>Score</label><span id="res-score">0</span></div><div class="stat-box"><label>XP</label><span id="res-xp">+0</span></div></div>
            <button class="btn-main" onclick="closeResults()">Library</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
