<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AXIOM | Mathematical Archive</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23a594f9%22>Ψ</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: { ready: () => { MathJax.startup.defaultReady(); window.mjReady = true; } }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Subtle Scholarly Decor -->
    <div class="scholarly-bg">
        <span class="symbol top-left">∫</span>
        <span class="symbol top-right">π</span>
        <span class="symbol bottom-left">Δ</span>
        <span class="symbol bottom-right">Ω</span>
    </div>

    <div class="app-container">
        <!-- AUTH SCREEN -->
        <div id="screen-login" class="screen">
            <div class="auth-wrap">
                <div class="academic-seal">A</div>
                <h1 class="serif-title main-logo">AXIOM</h1>
                <p class="label tracking">Scholarly Archive Authorization</p>
                <div class="auth-input-group">
                    <input type="text" id="callsign-input" placeholder="Scholar Identity" autocomplete="off">
                    <button class="btn-primary" onclick="submitLogin()">Authorize Access</button>
                </div>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="screen-home" class="screen hidden">
            <header class="scholarly-header">
                <div class="user-info">
                    <p class="label">Academician</p>
                    <h2 class="serif-title" id="display-name">Identity</h2>
                </div>
                <div class="retention-score">
                    <svg viewBox="0 0 100 100">
                        <circle class="track" cx="50" cy="50" r="45"></circle>
                        <circle id="xp-ring" class="fill" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <span id="level-val">1</span>
                </div>
            </header>

            <div class="scroll-content">
                <div class="stat-banner">
                    <div class="stat-item"><small class="label">Accuracy</small><span id="accuracy-val">0%</span></div>
                    <div class="stat-item"><small class="label">Best Mastery</small><span id="best-val">0</span></div>
                </div>

                <h3 class="label section-title">Discipline Archives</h3>
                <div class="discipline-list">
                    <button class="card-btn" onclick="selectChapter('trigonometry')">
                        <span class="serif-title">Trigonometry</span>
                        <small>Circular & Analytic Identities</small>
                    </button>
                    <button class="card-btn" onclick="selectChapter('calculus')">
                        <span class="serif-title">Calculus</span>
                        <small>Infinitesimal Variations</small>
                    </button>
                </div>

                <button id="repair-btn" class="btn-outline hidden" onclick="startRepair()">Address Weaknesses</button>
            </div>
        </div>

        <!-- ARENA -->
        <div id="screen-game" class="screen hidden">
            <div class="arena-hud">
                <div class="hud-label" id="lives-box">III</div>
                <div class="timer-rail"><div id="timer-fill"></div></div>
                <div class="hud-label" id="streak-box">0</div>
            </div>

            <div class="arena-body">
                <div class="formula-card">
                    <label class="label">Recall Identity</label>
                    <div id="formula-display" class="math-main"></div>
                </div>
                <div id="options-stack" class="options-vertical"></div>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav hidden" id="main-nav">
            <button class="nav-tab active" onclick="showScreen('screen-home')">Library</button>
            <button class="nav-tab" onclick="showScreen('screen-vault')">Vault</button>
            <button class="nav-tab" onclick="showScreen('screen-logs')">Gaps</button>
        </nav>

        <!-- SUB SCREENS -->
        <div id="screen-vault" class="screen hidden">
            <h2 class="serif-title">The Archive</h2>
            <div class="scroll-content" id="vault-list"></div>
        </div>
        <div id="screen-logs" class="screen hidden">
            <h2 class="serif-title">Knowledge Gaps</h2>
            <div class="scroll-content" id="logs-list"></div>
        </div>
    </div>

    <!-- ROAST OVERLAY -->
    <div id="roast-overlay" class="overlay hidden">
        <div class="recall-sheet">
            <p id="roast-msg" class="roast-text italic"></p>
            <div class="correction-box">
                <label class="label">True Resolution</label>
                <div id="correct-display"></div>
            </div>
            <button class="btn-primary" onclick="closeRoast()">Return to Study</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
