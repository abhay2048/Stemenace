<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AXIOM | Scholarly Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: { ready: () => { MathJax.startup.defaultReady(); window.mjReady = true; } }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scholarly-bg">
        <span class="float-math">∫</span><span class="float-math">∑</span><span class="float-math">π</span>
        <span class="float-math">∂</span><span class="float-math">∞</span>
    </div>

    <div class="app-container">
        <!-- AUTH SCREEN -->
        <div id="screen-login" class="screen">
            <div class="auth-wrap">
                <div class="seal">A</div>
                <h1 class="serif-title logo-text">AXIOM</h1>
                <p class="label-muted">Scholarly Identity Required</p>
                <div class="input-group">
                    <input type="text" id="callsign-input" placeholder="Scholar Name..." autocomplete="off">
                    <button class="btn-primary" onclick="submitLogin()">Authenticate</button>
                </div>
            </div>
        </div>

        <!-- HOME DASHBOARD -->
        <div id="screen-home" class="screen hidden">
            <header class="home-header">
                <div class="profile">
                    <span id="rank-tag" class="label-muted">Novice Scholar</span>
                    <h2 id="display-name" class="serif-title">Scholar</h2>
                </div>
                <div class="index-circle-wrap">
                    <svg viewBox="0 0 36 36" class="circular-chart">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path id="xp-ring" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <div class="index-label"><span id="level-val">1</span><small>INDEX</small></div>
                </div>
            </header>

            <div class="stats-grid">
                <div class="stat-card"><label>BEST STREAK</label><span id="best-val">0</span></div>
                <div class="stat-card"><label>ACCURACY</label><span id="accuracy-val">0%</span></div>
            </div>

            <div class="menu-stack">
                <button class="menu-btn" onclick="showScreen('screen-chapters')">
                    <span class="serif-title">Enter Archive</span>
                    <small>Commence identity verification</small>
                </button>
                <button id="repair-btn" class="menu-btn weakness" style="display:none;" onclick="startRepair()">
                    <span class="serif-title">Repair Gaps</span>
                    <small>Focus on identified weaknesses</small>
                </button>
            </div>
        </div>

        <!-- GAME ARENA (PRACTICE) -->
        <div id="screen-game" class="screen hidden">
            <div class="arena-hud">
                <div id="lives-box" class="hud-item">❤️❤️❤️</div>
                <div class="timer-rail"><div id="timer-fill"></div></div>
                <div id="streak-box" class="hud-item serif-title">0</div>
            </div>
            
            <div class="question-container">
                <div class="hero-card">
                    <div id="formula-display" class="math-content"></div>
                </div>
            </div>

            <div id="options-stack" class="options-grid">
                <!-- Buttons Injected via JS -->
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <nav id="main-dock" class="bottom-dock hidden">
            <div class="nav-item active" onclick="showScreen('screen-home')">Library</div>
            <div class="nav-item" onclick="showScreen('screen-vault')">Archive</div>
            <div class="nav-item" onclick="showScreen('screen-logs')">Gaps</div>
        </nav>

        <!-- SUB-SCREENS -->
        <div id="screen-chapters" class="screen hidden">
            <header class="sub-header"><button class="btn-back" onclick="showScreen('screen-home')">←</button><h2>Archives</h2></header>
            <div class="scroll-body" id="chapter-list"></div>
        </div>
        <div id="screen-difficulty" class="screen hidden">
            <header class="sub-header"><button class="btn-back" onclick="showScreen('screen-chapters')">←</button><h2>Set Pace</h2></header>
            <div class="scroll-body">
                <button class="menu-btn" onclick="setDiff(30)">Contemplative (30s)</button>
                <button class="menu-btn" onclick="setDiff(15)">Focused (15s)</button>
                <button class="menu-btn critical" onclick="setDiff(8)">Instant (8s)</button>
            </div>
        </div>
        <div id="screen-vault" class="screen hidden"><header class="sub-header"><h2>Manuscript Vault</h2></header><div class="scroll-body" id="vault-list"></div></div>
        <div id="screen-logs" class="screen hidden"><header class="sub-header"><h2>Knowledge Gaps</h2></header><div class="scroll-body" id="logs-list"></div></div>
    </div>

    <!-- OVERLAYS -->
    <div id="roast-overlay" class="overlay hidden">
        <div class="recall-modal">
            <p id="roast-msg" class="roast-text"></p>
            <div class="reveal-area"><label>CORRECT IDENTITY</label><div id="correct-display" class="math-content"></div></div>
            <button class="btn-primary" onclick="closeRoast()">Return to Session</button>
        </div>
    </div>

    <div id="results-overlay" class="overlay hidden">
        <div class="recall-modal">
            <h2 class="serif-title">Session Summary</h2>
            <div class="stats-grid" style="margin:20px 0;"><div class="stat-card"><label>SCORE</label><span id="res-score">0</span></div><div class="stat-card"><label>XP</label><span id="res-xp">+0</span></div></div>
            <button class="btn-primary" onclick="closeResults()">Back to Library</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
