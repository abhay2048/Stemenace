<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AXIOM | Mathematical Archive</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: { ready: () => { MathJax.startup.defaultReady(); window.mjReady = true; } }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Scholars Background -->
    <div class="scholarly-bg">
        <span class="float-math">Ψ</span><span class="float-math">Ω</span><span class="float-math">λ</span>
        <span class="float-math">∫</span><span class="float-math">∬</span><span class="float-math">∮</span>
    </div>

    <div class="app-container">
        <!-- SIDEBAR / NAV -->
        <aside class="sidebar" id="sidebar">
            <div class="brand"><h1>AXIOM</h1></div>
            <div class="retention-status">
                <label class="label">Retention Index</label>
                <div class="ring-container">
                    <svg viewBox="0 0 100 100">
                        <circle class="track" cx="50" cy="50" r="45"></circle>
                        <circle id="xp-ring" class="fill" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <div class="ring-text"><span id="level-val">1</span></div>
                </div>
            </div>
            <nav class="nav-links">
                <button class="nav-item active" onclick="showScreen('screen-home')">Library</button>
                <button class="nav-item" onclick="showScreen('screen-vault')">The Archive</button>
                <button class="nav-item" onclick="showScreen('screen-logs')">Knowledge Gaps</button>
            </nav>
        </aside>

        <!-- MAIN AREA -->
        <main class="main-content">
            <!-- DASHBOARD -->
            <div id="screen-home" class="screen">
                <header class="view-header">
                    <div class="meta">
                        <h2 class="serif-title" id="display-name">Scholar</h2>
                        <span class="rank-label" id="rank-tag">Rank: Novice</span>
                    </div>
                </header>
                <div class="scroll-area">
                    <div class="stat-grid">
                        <div class="stat-card"><label class="label">Accuracy</label><span id="accuracy-val">0%</span></div>
                        <div class="stat-card"><label class="label">Mastery Streak</label><span id="best-val">0</span></div>
                    </div>
                    <div class="category-grid">
                        <button class="cat-card" onclick="selectChapter('trigonometry')"><h3>Trigonometry</h3><p>Circular & Periodic Functions</p></button>
                        <button class="cat-card" onclick="selectChapter('calculus')"><h3>Calculus</h3><p>Differentiation & Integration</p></button>
                    </div>
                    <button id="repair-btn" class="btn-repair" style="display:none;" onclick="startRepair()">Address Weaknesses</button>
                </div>
            </div>

            <!-- GAME ARENA -->
            <div id="screen-game" class="screen hidden">
                <div class="arena-hud">
                    <div id="lives-box" class="hud-item">Integrity: III</div>
                    <div class="timer-rail"><div id="timer-fill"></div></div>
                    <div id="streak-box" class="hud-item">0</div>
                </div>
                <div class="arena-content">
                    <div class="formula-card">
                        <label class="label">Identify the resolution</label>
                        <div id="formula-display" class="math-main"></div>
                    </div>
                    <div id="options-stack" class="options-grid"></div>
                </div>
            </div>

            <!-- VAULT / LOGS (Shared List Style) -->
            <div id="screen-vault" class="screen hidden">
                <h2 class="serif-title">Mathematical Archive</h2>
                <div class="scroll-area" id="vault-list"></div>
            </div>
            <div id="screen-logs" class="screen hidden">
                <h2 class="serif-title">Inaccurate Recalls</h2>
                <div class="scroll-area" id="logs-list"></div>
            </div>
        </main>
    </div>

    <!-- CORRECTION OVERLAY (The Roast) -->
    <div id="roast-overlay" class="overlay hidden">
        <div class="recall-sheet">
            <p id="roast-msg" class="roast-text"></p>
            <div class="correction-box">
                <label class="label">True Resolution</label>
                <div id="correct-display"></div>
            </div>
            <button class="btn-primary" onclick="closeRoast()">Return to Study</button>
        </div>
    </div>

    <!-- LOGIN OVERLAY -->
    <div id="screen-login" class="overlay">
        <div class="login-card">
            <h1 class="serif-title">AXIOM</h1>
            <p class="label">Library Access Authorization</p>
            <input type="text" id="callsign-input" placeholder="Enter Scholar Identity..." autocomplete="off">
            <button class="btn-primary" onclick="submitLogin()">Authorize</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
