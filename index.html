<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AXIOM | Mathematical Navigator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: { ready: () => { MathJax.startup.defaultReady(); window.mjReady = true; } }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Constrained Atmospheric Layer -->
    <div class="scholarly-bg">
        <span class="float-math" style="--d: 15s; --x: 10%; --y: 20%;">∫</span>
        <span class="float-math" style="--d: 22s; --x: 80%; --y: 10%;">∑</span>
        <span class="float-math" style="--d: 18s; --x: 15%; --y: 70%;">π</span>
        <span class="float-math" style="--d: 25s; --x: 75%; --y: 80%;">∂</span>
        <span class="float-math" style="--d: 20s; --x: 50%; --y: 40%;">∞</span>
    </div>

    <div class="app-container">
        <!-- SCREEN: LOGIN (Based on Inspiration) -->
        <section id="screen-login" class="screen">
            <div class="auth-wrap">
                <div class="seal-container">
                    <div class="seal-square">A</div>
                </div>
                <h1 class="axiom-logo">AXIOM</h1>
                <p class="tagline">Mathematical Navigator</p>
                <div class="login-card">
                    <input type="text" id="callsign-input" placeholder="Operator Identity" autocomplete="off">
                    <button class="btn-initialize" onclick="submitLogin()">Initialize</button>
                </div>
            </div>
        </section>

        <!-- SCREEN: DASHBOARD -->
        <section id="screen-home" class="screen hidden">
            <header class="home-header">
                <div class="user-meta">
                    <span id="rank-tag" class="label-accent">Mastery: Novice</span>
                    <h2 id="display-name" class="serif-title">Scholar</h2>
                </div>
                <div class="index-circle">
                    <svg viewBox="0 0 36 36" class="chart">
                        <path class="ring-track" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path id="xp-ring" class="ring-fill" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <div class="ring-center"><span id="level-val">1</span><small>Retention Index</small></div>
                </div>
            </header>

            <div class="stats-row">
                <div class="stat-pill">Recall Streak: <span id="best-val">0</span></div>
                <div class="stat-pill">Accuracy: <span id="accuracy-val">0%</span></div>
            </div>

            <div class="home-actions">
                <button class="btn-primary-satisfying" onclick="showScreen('screen-chapters')">Commence Study Session</button>
                <button id="repair-btn" class="btn-secondary-matte" style="display:none;" onclick="startRepair()">Address Weaknesses</button>
            </div>
        </section>

        <!-- SCREEN: ARENA -->
        <section id="screen-game" class="screen hidden">
            <div class="hud">
                <div id="lives-box" class="hud-item">❤️❤️❤️</div>
                <div class="timer-box"><div id="timer-fill"></div></div>
                <div id="streak-box" class="hud-item serif-title">0</div>
            </div>
            
            <div class="arena-hero">
                <div class="formula-card-depth">
                    <div id="formula-display" class="math-render"></div>
                </div>
            </div>

            <div id="options-stack" class="options-grid">
                <!-- 4 Stacked Buttons -->
            </div>
        </section>

        <!-- SCREEN: ARCHIVE (FLASHCARD LIST) -->
        <section id="screen-vault" class="screen hidden">
            <header class="sub-header"><h2>Manuscript Vault</h2></header>
            <div class="scroll-area" id="vault-list">
                <!-- List items reveal on click -->
            </div>
        </section>

        <!-- NAVIGATION -->
        <nav id="main-dock" class="bottom-nav hidden">
            <div class="nav-item active" onclick="showScreen('screen-home')">Library</div>
            <div class="nav-item" onclick="showScreen('screen-vault')">Archive</div>
            <div class="nav-item" onclick="showScreen('screen-logs')">Gaps</div>
        </nav>

        <!-- SUB SCREENS -->
        <div id="screen-chapters" class="screen hidden">
            <header class="sub-header"><button class="btn-back" onclick="showScreen('screen-home')">←</button><h2>Archives</h2></header>
            <div class="scroll-area" id="chapter-list"></div>
        </div>
        <div id="screen-difficulty" class="screen hidden">
            <header class="sub-header"><button class="btn-back" onclick="showScreen('screen-chapters')">←</button><h2>Set Pace</h2></header>
            <div class="scroll-area">
                <button class="btn-primary-satisfying" onclick="setDiff(30)">Contemplative (30s)</button>
                <button class="btn-primary-satisfying" onclick="setDiff(15)">Focused (15s)</button>
                <button class="btn-primary-satisfying critical" onclick="setDiff(8)">Instant (8s)</button>
            </div>
        </div>
        <div id="screen-logs" class="screen hidden"><header class="sub-header"><h2>Knowledge Gaps</h2></header><div class="scroll-area" id="logs-list"></div></div>
    </div>

    <!-- RECALL OVERLAY -->
    <div id="roast-overlay" class="overlay hidden">
        <div class="modal-sheet">
            <p id="roast-msg" class="roast-italic"></p>
            <div class="reveal-box"><label>Correct Identity</label><div id="correct-display" class="math-render"></div></div>
            <button class="btn-primary-satisfying" onclick="closeRoast()">Continue Session</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
