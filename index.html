<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AXIOM | Scholarly Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            startup: { ready: () => { MathJax.startup.defaultReady(); window.mjReady = true; } }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Atmospheric Layer -->
    <div class="scholarly-bg">
        <span class="float-math" style="top:15%; left:10%">∫</span>
        <span class="float-math" style="top:45%; right:15%">∑</span>
        <span class="float-math" style="bottom:25%; left:15%">π</span>
        <span class="float-math" style="bottom:10%; right:10%">∂</span>
    </div>

    <div class="app-container">
        <!-- AUTH SCREEN -->
        <section id="screen-login" class="screen">
            <div class="auth-center">
                <div class="seal-logo">A</div>
                <h1 class="serif-title axiom-logo">AXIOM</h1>
                <p class="label-muted tracking-wide">Scholarly Identity Required</p>
                <div class="login-input-group">
                    <input type="text" id="callsign-input" placeholder="Operator Identity" autocomplete="off">
                    <button class="btn-primary" onclick="submitLogin()">Initialize</button>
                </div>
            </div>
        </section>

        <!-- DASHBOARD -->
        <section id="screen-home" class="screen hidden">
            <header class="dash-header">
                <div class="profile-info">
                    <span id="rank-tag" class="label-accent">Novice Scholar</span>
                    <h2 id="display-name" class="serif-title">Scholar</h2>
                </div>
                <div class="retention-ring-wrap">
                    <svg viewBox="0 0 36 36" class="circular-chart">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path id="xp-ring" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <div class="ring-label"><span id="level-val">1</span><small>INDEX</small></div>
                </div>
            </header>

            <div class="stat-cards-grid">
                <div class="stat-card"><label>BEST STREAK</label><span id="best-val">0</span></div>
                <div class="stat-card"><label>ACCURACY</label><span id="accuracy-val">0%</span></div>
            </div>

            <div class="menu-list">
                <button class="action-btn-matte" onclick="showScreen('screen-chapters')">
                    <span class="serif-title">Commence Session</span>
                    <small>Verify archive manuscripts</small>
                </button>
                <button id="repair-btn" class="action-btn-matte gap-repair" style="display:none;" onclick="startRepair()">
                    <span class="serif-title">Address Weaknesses</span>
                    <small>Focus on identified gaps</small>
                </button>
            </div>
        </section>

        <!-- PRACTICE ARENA -->
        <section id="screen-game" class="screen hidden">
            <div class="arena-hud">
                <div id="lives-box" class="hud-label">❤️❤️❤️</div>
                <div class="timer-rail"><div id="timer-fill"></div></div>
                <div id="streak-box" class="hud-label serif-title">0</div>
            </div>
            
            <div class="question-hero-wrap">
                <div class="formula-card">
                    <div id="formula-display" class="math-main"></div>
                </div>
            </div>

            <div id="options-stack" class="options-container">
                <!-- Buttons Injected -->
            </div>
        </section>

        <!-- ARCHIVE (MANUAL RECALL MODE) -->
        <section id="screen-vault" class="screen hidden">
            <header class="sub-header"><button class="btn-icon" onclick="showScreen('screen-home')">←</button><h2>Archives</h2></header>
            <div class="recall-container">
                <div class="formula-card mini">
                    <div id="archive-q-display" class="math-main"></div>
                </div>
                <div class="manual-recall-box" id="recall-input-area">
                    <textarea id="manual-answer" placeholder="Visualize the result..."></textarea>
                    <button class="btn-primary" onclick="revealArchiveAnswer()">Reveal Manuscript</button>
                </div>
                <div id="archive-reveal-area" class="hidden">
                    <div class="formula-card result-depth">
                        <label class="label-muted">Correct Identity</label>
                        <div id="archive-a-display" class="math-main"></div>
                    </div>
                    <button class="btn-outline" onclick="nextArchiveItem()">Next Formula</button>
                </div>
            </div>
        </section>

        <!-- BOTTOM NAVIGATION -->
        <nav id="main-dock" class="bottom-dock hidden">
            <div class="dock-item active" onclick="showScreen('screen-home')">Library</div>
            <div class="dock-item" onclick="showScreen('screen-vault')">Archive</div>
            <div class="dock-item" onclick="showScreen('screen-logs')">Gaps</div>
        </nav>

        <!-- MISC SCREENS -->
        <div id="screen-chapters" class="screen hidden">
            <header class="sub-header"><button class="btn-icon" onclick="showScreen('screen-home')">←</button><h2>Archives</h2></header>
            <div class="scroll-v" id="chapter-list"></div>
        </div>
        <div id="screen-difficulty" class="screen hidden">
            <header class="sub-header"><button class="btn-icon" onclick="showScreen('screen-chapters')">←</button><h2>Pace</h2></header>
            <div class="scroll-v">
                <button class="action-btn-matte" onclick="setDiff(30)">Contemplative (30s)</button>
                <button class="action-btn-matte" onclick="setDiff(15)">Focused (15s)</button>
                <button class="action-btn-matte critical" onclick="setDiff(8)">Instant (8s)</button>
            </div>
        </div>
        <div id="screen-logs" class="screen hidden"><header class="sub-header"><h2>Knowledge Gaps</h2></header><div class="scroll-v" id="logs-list"></div></div>
    </div>

    <!-- OVERLAYS -->
    <div id="roast-overlay" class="overlay hidden">
        <div class="modal-sheet">
            <p id="roast-msg" class="roast-text"></p>
            <div class="answer-box">
                <small class="label-muted">True Identity</small>
                <div id="correct-display" class="math-main"></div>
            </div>
            <button class="btn-primary" onclick="closeRoast()">Continue Study</button>
        </div>
    </div>

    <div id="results-overlay" class="overlay hidden">
        <div class="modal-sheet">
            <h2 class="serif-title">Session Concluded</h2>
            <div class="stat-cards-grid" style="margin:20px 0;"><div class="stat-card"><label>SCORE</label><span id="res-score">0</span></div><div class="stat-card"><label>XP</label><span id="res-xp">+0</span></div></div>
            <button class="btn-primary" onclick="closeResults()">Back to Library</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
